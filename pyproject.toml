[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nl2sql-assistant"
version = "0.1.0"
description = "Ask a database questions in plain English, with layered guardrails against unsafe SQL."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []  # the core runs on the standard library only

[project.optional-dependencies]
postgres = ["sqlalchemy>=2.0", "psycopg[binary]>=3.1"]
dev = ["pytest>=7"]

[project.scripts]
nl2sql = "nl2sql.cli:main"

[tool.setuptools.packages.find]
include = ["nl2sql*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
